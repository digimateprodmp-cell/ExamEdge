services:
  mysql:
    image: mysql:8.0
    container_name: test-mela-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_mela
      MYSQL_USER: test_mela
      MYSQL_PASSWORD: test_mela
    ports:
      - "3306:3306"
    volumes:
      - test-mela-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: test-mela-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  test-mela-mysql-data:
