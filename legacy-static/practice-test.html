<!DOCTYPE html>
<html>
<head>
  <title>Practice Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6fb">

<div class="container mt-4">

  <div class="card border-0 shadow-sm" style="border-radius:16px;">
    <div class="card-body">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0" id="pageTitle"></h5>
        <span class="badge bg-success" id="langBadge"></span>
      </div>

      <hr>

      <!-- Content -->
      <div class="text-center py-5">
        <h4 class="fw-bold mb-2" id="testTitle"></h4>
        <p class="text-muted" id="testInfo"></p>

        <div class="alert alert-info mt-4" id="practiceNote"></div>

        <button class="btn btn-primary btn-lg mt-3" id="startBtn"></button>
      </div>

    </div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const lang = params.get("lang");

// Language based content
const data = {
  hindi: {
    pageTitle: "प्रैक्टिस मोड",
    testTitle: "प्राचीन इतिहास – टेस्ट सेट #01",
    testInfo: "100 प्रश्न • कोई समय सीमा नहीं",
    practiceNote: "आप हर सवाल के बाद उत्तर देख सकते हैं।",
    startBtn: "प्रैक्टिस शुरू करें",
    badge: "Hindi"
  },
  english: {
    pageTitle: "Practice Mode",
    testTitle: "Ancient History – Test Set #01",
    testInfo: "100 Questions • No Time Limit",
    practiceNote: "You can view answer after every question.",
    startBtn: "Start Practice",
    badge: "English"
  }
};

const d = data[lang];

// Inject into UI
document.getElementById("pageTitle").innerText = d.pageTitle;
document.getElementById("testTitle").innerText = d.testTitle;
document.getElementById("testInfo").innerText = d.testInfo;
document.getElementById("practiceNote").innerText = d.practiceNote;
document.getElementById("startBtn").innerText = d.startBtn;
document.getElementById("langBadge").innerText = d.badge;
</script>

</body>
</html>
