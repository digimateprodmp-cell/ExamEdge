<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Gurumantra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .login-input {
      border-radius: 10px;
      height: 45px;
    }

    .btn-login {
      background: #7b1623;
      color: white;
      border-radius: 12px;
      height: 45px;
    }

    .btn-login:hover {
      background: #5c101a;
    }

    .text-orange {
      color: #fb7e09;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="login-card">
    <h3 class=" mb-3 text-center">Register with</h3>

  <form onsubmit="return finalSubmit()">

    <div class="mb-3">
      <input type="text" class="form-control login-input" placeholder="Name" required>
    </div>

    <!-- Email -->
    <div class="mb-2">
      <input type="email" id="email" class="form-control login-input" placeholder="Email" required>
    </div>

    <div class="text-end mb-3">
      <button type="button" class="btn btn-primary btn-sm" onclick="sendOtp()">
        Send OTP
      </button>
    </div>

    <!-- OTP Box -->
    <div id="otpBox" class="mb-3 d-none">
      <input type="text" id="otpInput" maxlength="6"
             class="form-control login-input"
             placeholder="Enter 6 digit OTP">

      <button type="button"
              class="btn btn-success w-100 mt-2"
              onclick="verifyOtp()">
        Verify OTP
      </button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control login-input" placeholder="Phone" required>
    </div>

    <div class="mb-3">
      <input type="password" class="form-control login-input" placeholder="Password" required>
    </div>

    <div class="mb-3">
      <input type="password" class="form-control login-input" placeholder="Confirm Password" required>
    </div>

    <div class="mb-3">
      <select class="form-control login-input" required>
        <option value="">-- Select State --</option>
        <option>Madhya Pradesh</option>
        <option>Rajasthan</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Uttar Pradesh</option>
      </select>
    </div>

    <div class="mb-4">
      <input type="text" class="form-control login-input" placeholder="Referral Code (optional)">
    </div>

    <button type="submit" class="btn btn-login w-100 mb-3">
      Sign up
    </button>

    <p class="text-center small">
      Already have an account?
      <a href="login.html" class="text-orange fw-bold">Sign in</a>
    </p>

  </form>
</div>

<script>
let generatedOtp = "";
let otpVerified = false;

function sendOtp() {
  const email = document.getElementById("email").value;

  if (!email) {
    alert("Please enter email first");
    return;
  }

  generatedOtp = Math.floor(100000 + Math.random() * 900000);

  alert("Demo OTP sent to your email: " + generatedOtp);
  document.getElementById("otpBox").classList.remove("d-none");
}

function verifyOtp() {
  const userOtp = document.getElementById("otpInput").value;

  if (userOtp == generatedOtp) {
    alert("OTP verified successfully");
    otpVerified = true;
    document.getElementById("otpBox").classList.add("d-none");
  } else {
    alert("Invalid OTP, try again");
  }
}

function finalSubmit() {
  if (!otpVerified) {
    alert("Please verify OTP first");
    return false;
  }

  alert("Registration Successful (Demo)");
  return false; // backend nahi hai isliye
}
</script>

</body>
</html>
