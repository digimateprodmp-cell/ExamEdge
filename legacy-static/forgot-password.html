<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | GURUMANTRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f6f8fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      width: 380px;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 22px;
    }

    p {
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #7b1022;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #5e0c19;
    }

    .back {
      margin-top: 18px;
      font-size: 13px;
    }

    .back a {
      color: orange;
      text-decoration: none;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .otp-box {
      letter-spacing: 6px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- STEP 1 -->
  <div id="step1">
    <h2>Forgot Password</h2>
    <p>Enter your registered email to receive OTP</p>

    <input type="email" id="email" placeholder="Enter your email">
    <button onclick="sendOtp()">Send OTP</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <h2>Enter OTP</h2>
    <p>We have sent a 6 digit OTP on your email</p>

    <input type="text" id="otp" maxlength="6" class="otp-box" placeholder="------">
    <button onclick="verifyOtp()">Verify OTP</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="hidden">
    <h2>Set your new password</h2>
    <p>Create a strong password for your account</p>

    <input type="password" id="newPass" placeholder="New Password">
    <input type="password" id="confirmPass" placeholder="Confirm Password">
    <button onclick="resetPassword()">Reset Password</button>
  </div>

  <div class="back">
    Back to <a href="login.html">Login</a>
  </div>

</div>

<script>
  let demoOtp = "";

  function sendOtp() {
    const email = document.getElementById("email").value;
    if (!email) {
      alert("Enter email first");
      return;
    }

    demoOtp = "123456";   // demo OTP
    alert("Demo OTP: " + demoOtp);

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
  }

  function verifyOtp() {
    const otp = document.getElementById("otp").value;

    if (otp === demoOtp) {
      alert("OTP Verified");

      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");
    } else {
      alert("Invalid OTP");
    }
  }

  function resetPassword() {
    const p1 = document.getElementById("newPass").value;
    const p2 = document.getElementById("confirmPass").value;

    if (!p1 || !p2) {
      alert("Fill all fields");
      return;
    }

    if (p1 !== p2) {
      alert("Passwords do not match");
      return;
    }

    alert("Password reset successfully!");
    window.location.href = "login.html";
  }
</script>

</body>
</html>
