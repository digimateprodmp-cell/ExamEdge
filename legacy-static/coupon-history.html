<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coupon History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">
  <h4 class="mb-4 fw-bold">Coupon History</h4>
  
  <div class="coupon-wrapper">

    <div class="coupon-card used">
      <div class="coupon-main">
        <div class="coupon-details">
          <span class="badge mb-2">Used</span>
          <h5 class="course-name">SSC Test Series</h5>
          <p class="discount-text">Applied for ₹500 Discount</p>
        </div>
        <div class="coupon-code-section">
          <div class="code-label">CODE</div>
          <div class="code-value">GM50</div>
        </div>
      </div>
      <div class="coupon-footer">
        <span><i class="bi bi-calendar-check"></i> Used on: 12 Jan 2026</span>
      </div>
    </div>

    <div class="coupon-card expired">
      <div class="coupon-main">
        <div class="coupon-details">
          <span class="badge mb-2">Expired</span>
          <h5 class="course-name">Banking Course</h5>
          <p class="discount-text">Worth ₹300 Discount</p>
        </div>
        <div class="coupon-code-section">
          <div class="code-label">CODE</div>
          <div class="code-value">NEWUSER</div>
        </div>
      </div>
      <div class="coupon-footer">
        <span><i class="bi bi-calendar-x"></i> Expired on: 20 Jan 2026</span>
      </div>
    </div>

  </div>
</div>
