<!DOCTYPE html>
<html>
<head>
  <title>Live Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f6fb">

<div class="container mt-4">

  <div class="card border-0 shadow-sm" style="border-radius:16px;">
    <div class="card-body">

      <div class="d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0" id="pageTitle"></h5>
        <span class="badge bg-primary" id="langBadge"></span>
      </div>

      <hr>

      <div class="text-center py-5">
        <h4 class="fw-bold mb-2" id="testTitle"></h4>
        <p class="text-muted" id="testInfo"></p>

        <button class="btn btn-success btn-lg mt-3" id="startBtn"></button>
      </div>

    </div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const lang = params.get("lang");

// Language Data (real platforms also do this)
const data = {
  hindi: {
    pageTitle: "लाइव टेस्ट",
    testTitle: "प्राचीन इतिहास – टेस्ट सेट #01",
    testInfo: "100 प्रश्न • समय: 60 मिनट",
    startBtn: "टेस्ट शुरू करें",
    badge: "Hindi"
  },
  english: {
    pageTitle: "Live Test",
    testTitle: "Ancient History – Test Set #01",
    testInfo: "100 Questions • Time: 60 min",
    startBtn: "Start Test",
    badge: "English"
  }
};

const d = data[lang];

// Inject text
document.getElementById("pageTitle").innerText = d.pageTitle;
document.getElementById("testTitle").innerText = d.testTitle;
document.getElementById("testInfo").innerText = d.testInfo;
document.getElementById("startBtn").innerText = d.startBtn;
document.getElementById("langBadge").innerText = d.badge;
</script>

</body>
</html>
