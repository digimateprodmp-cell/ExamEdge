<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Sets</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background:#f4f6fb; }
    .test-card { border-radius:16px; }
    .thumb {
      width:70px;height:70px;border-radius:12px;object-fit:cover;
    }
  </style>
</head>

<body>

<div class="container mt-4">

  <h5 class="fw-bold mb-3">List of Test Sets</h5>

  <!-- Test Set -->
  <div class="card border-0 shadow-sm mb-3 test-card">
    <div class="card-body">

      <div class="d-flex align-items-center gap-3">
        <img src="images/course-bg.png" class="thumb">
        <div class="flex-grow-1">
          <h6 class="fw-bold mb-1">Ancient History – Test Set #01</h6>
          <small class="text-muted">100 Questions • Free</small>
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-danger w-100"
          onclick="goPayment('live','Ancient History – Test Set #01')">
          Live
        </button>

        <button class="btn btn-success w-100"
          onclick="goPayment('practice','Ancient History – Test Set #01')">
          Practice
        </button>

        <button class="btn btn-primary w-100"
          onclick="goPayment('pdf','Ancient History – Test Set #01')">
          PDF Test
        </button>
      </div>

    </div>
  </div>

  <!-- Test Set 2 -->
  <div class="card border-0 shadow-sm mb-3 test-card">
    <div class="card-body">

      <div class="d-flex align-items-center gap-3">
        <img src="images/course-bg.png" class="thumb">
        <div class="flex-grow-1">
          <h6 class="fw-bold mb-1">Medieval History – Test Set #02</h6>
          <small class="text-muted">80 Questions • Free</small>
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-danger w-100"
          onclick="goPayment('live','Medieval History – Test Set #02')">
          Live
        </button>

        <button class="btn btn-success w-100"
          onclick="goPayment('practice','Medieval History – Test Set #02')">
          Practice
        </button>

        <button class="btn btn-primary w-100"
          onclick="goPayment('pdf','Medieval History – Test Set #02')">
          PDF Test
        </button>
      </div>

    </div>
  </div>

</div>

<script>
function goPayment(mode, testName) {
  window.location.href =
    "payment.html?mode=" + mode + "&test=" + encodeURIComponent(testName);
}
</script>

</body>
</html>
