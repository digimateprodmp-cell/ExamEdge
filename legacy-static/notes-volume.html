<!DOCTYPE html>
<html>
<head>
  <title>Notes Volume | Gurumantra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="background:#f4f6fb">

<nav class="navbar bg-white shadow-sm sticky-top">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="batch-details.html" class="text-decoration-none fw-bold text-primary">
      <i class="bi bi-arrow-left"></i> Back
    </a>
    <span class="fw-bold">Notes Volume</span>
    <div style="width:40px"></div>
  </div>
</nav>

<div class="container mt-4">

  <h5 class="fw-bold mb-3">Available Notes</h5>

  <!-- Note Card -->
  <div class="card border-0 shadow-sm mb-3" style="border-radius:16px;">
    <div class="card-body d-flex justify-content-between align-items-center">

      <div class="d-flex align-items-center gap-3">
        <div class="bg-danger bg-opacity-10 p-3 rounded-circle">
          <i class="bi bi-file-earmark-pdf text-danger fs-3"></i>
        </div>

        <div>
          <h6 class="fw-bold mb-0">Indian Polity Handwritten Notes</h6>
          <small class="text-muted">Part 1 – Fundamental Rights</small>
        </div>
      </div>

      <a href="note-view.html?locked=true" class="btn btn-dark rounded-pill px-4">
        Read
      </a>
    </div>
  </div>

  <!-- Free Example -->
  <div class="card border-0 shadow-sm mb-3" style="border-radius:16px;">
    <div class="card-body d-flex justify-content-between align-items-center">

      <div class="d-flex align-items-center gap-3">
        <div class="bg-success bg-opacity-10 p-3 rounded-circle">
          <i class="bi bi-file-earmark-pdf text-success fs-3"></i>
        </div>

        <div>
          <h6 class="fw-bold mb-0">Modern History Notes</h6>
          <small class="text-muted">1857 Revolt to Independence</small>
        </div>
      </div>

      <a href="pdf/modern-history.pdf" class="btn btn-success rounded-pill px-4">
        Read
      </a>
    </div>
  </div>

</div>

</body>
</html>
