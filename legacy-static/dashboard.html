<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Dashboard | Gurumantra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= DASHBOARD ================= -->
<section class="container my-5">

  <h3 class="fw-bold mb-3">My Dashboard</h3>

  <div class="row g-4">

   <!-- My Coupon CARD -->
<div class="col-md-3">
  <a href="my-coupons.html" class="text-decoration-none">
    <div class="dashboard-card">
      <i class="bi bi-ticket-perforated"></i>
      <h6>My Coupons</h6>
      <p>View all coupons</p>
    </div>
  </a>
</div>


    <!-- My coins card -->

<div class="col-md-3 position-relative">
  <div class="dashboard-card" id="coinToggle" style="cursor: pointer;">
    <i class="bi bi-coin"></i>
    <h6>My Coins</h6>
    <p>Coins History</p>
  </div>

  <div class="dashboard-dropdown d-none" id="coinDropdown">
    <a href="coins.html?tab=credit"><i class="bi bi-plus-circle"></i> Credit Coins</a>
    <a href="coins.html?tab=debit"><i class="bi bi-dash-circle"></i> Debit Coins</a>
  </div>
</div>


    <!-- 3. Active Courses -->
    <div class="col-md-3">
      <a href="active-courses.html" class="text-decoration-none">
        <div class="dashboard-card">
          <i class="bi bi-book"></i>
          <h6>Active Courses</h6>
          <p>Your ongoing courses</p>
        </div>
      </a>
    </div>

    <!-- 4. Recent Activity (Dropdown) -->
<div class="col-md-3 position-relative">
  <div class="dashboard-card dropdown-toggle-card" id="activityToggle">
    <i class="bi bi-grid"></i>
    <h6>Recent Activity</h6>
    <p>More options</p>
  </div>

  <!-- Dropdown -->
  <div class="dashboard-dropdown" id="activityDropdown">
    <a href="live-classes.html"><i class="bi bi-camera-video"></i> Live Classes</a>
    <a href="test-series.html"><i class="bi bi-clipboard-check"></i> Test Series</a>
    <a href="notes.html"><i class="bi bi-journal-text"></i> Notes</a>
    <a href="knowledge-store.html"><i class="bi bi-lightbulb"></i> Knowledge Store</a>
  </div>
</div>

</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main JS -->
<script src="js/main.js"></script>

</body>
</html>
